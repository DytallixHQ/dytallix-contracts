name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Library tests
        run: cargo test --all-targets
      - name: Ping example
        run: cargo test --manifest-path examples/ping/Cargo.toml
      - name: Counter example
        run: cargo test --manifest-path examples/counter/Cargo.toml
      - name: Reward splitter example
        run: cargo test --manifest-path examples/reward_splitter/Cargo.toml
      - name: Algorithm guard example
        run: cargo test --manifest-path examples/algorithm_guard/Cargo.toml

